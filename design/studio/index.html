<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="问阶 Interview Studio：知识、准备、文字训练与复练的整合交互预览。">
  <title>问阶 · Interview Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23246758'/%3E%3Cpath d='M10 29V20H19V11H29' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="studio.css">
  <script src="studio.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside class="sidebar" aria-label="应用导航">
    <a class="brand" href="#today" aria-label="问阶，返回今日"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 25V17H15V9H25"/></svg></span><span><strong>问阶</strong><small>Interview Studio</small></span></a>
    <button class="space-switch" data-action="about"><span class="workspace-avatar">J</span><span>我的面试工作台<small>Java 后端 · 个人空间</small></span><span class="space-arrow">⌄</span></button>
    <nav id="main-nav" aria-label="主要页面"></nav>
    <div class="sidebar-bottom"><div class="workspace-note"><span class="tiny-orbit"></span><p>让每次练习<br>都留下进步的依据。</p></div><button class="profile" data-action="about"><span class="avatar">我</span><span>个人工作空间<small>交互预览 · 示例数据</small></span><span class="profile-more">···</span></button></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumb"><span>个人空间</span><span class="crumb-separator">/</span><strong id="breadcrumb-current">知识</strong></div><div class="topbar-tools"><button class="global-search" data-action="search" aria-label="搜索知识和笔记"><span id="search-icon"></span><span>搜索你的知识与笔记</span><kbd>Ctrl K</kbd></button><button class="topbar-info" data-action="about" aria-label="查看预览说明">预览说明</button><button class="quick-add icon-button" data-action="new-note" aria-label="快速记录笔记">＋</button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span>问阶 · 从理解，到独立表达</span><span>示例数据仅在本页暂存，刷新还原</span></footer>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
