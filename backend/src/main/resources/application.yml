spring:
  application:
    name: interview-studio
  datasource:
    url: ${STUDIO_DATABASE_URL:}
    username: ${STUDIO_DATABASE_USERNAME:}
    password: ${STUDIO_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        preserveInstants: true
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: false
  mvc:
    log-request-details: false

server:
  port: ${STUDIO_HTTP_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: STUDIO_SESSION
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    connection-timeout: 15s
    max-http-form-post-size: 8KB
    max-swallow-size: 1MB
    threads:
      max: 32
      min-spare: 2

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    cache-enabled: false
    default-statement-timeout: 15
    jdbc-type-for-null: 'NULL'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

studio:
  ai:
    enabled: ${STUDIO_AI_ENABLED:false}
    protocol: ${STUDIO_AI_PROTOCOL:CHAT_COMPLETIONS}
    provider: ${STUDIO_AI_PROVIDER:}
    endpoint: ${STUDIO_AI_ENDPOINT:}
    model: ${STUDIO_AI_MODEL:}
    api-key: ${STUDIO_AI_API_KEY:}
    config-version: ${STUDIO_AI_CONFIG_VERSION:}
    price-version: ${STUDIO_AI_PRICE_VERSION:}
    currency: ${STUDIO_AI_CURRENCY:}
    input-price-micros-per-million: ${STUDIO_AI_INPUT_PRICE_MICROS_PER_MILLION:-1}
    output-price-micros-per-million: ${STUDIO_AI_OUTPUT_PRICE_MICROS_PER_MILLION:-1}
    daily-budget-micros: ${STUDIO_AI_DAILY_BUDGET_MICROS:0}
    max-output-tokens: ${STUDIO_AI_MAX_OUTPUT_TOKENS:1024}
    timeout-seconds: ${STUDIO_AI_TIMEOUT_SECONDS:60}
    max-tokens-field: ${STUDIO_AI_MAX_TOKENS_FIELD:max_tokens}
    json-mode: ${STUDIO_AI_JSON_MODE:false}
    streaming: ${STUDIO_AI_STREAMING:false}
  material:
    enabled: ${STUDIO_MATERIAL_ENABLED:false}
    directory: ${STUDIO_MATERIAL_DIRECTORY:}
    parser-enabled: ${STUDIO_MATERIAL_PARSER_ENABLED:false}
    quota-bytes: ${STUDIO_MATERIAL_QUOTA_BYTES:1073741824}
  search:
    enabled: ${STUDIO_SEARCH_ENABLED:false}
    directory: ${STUDIO_SEARCH_DIRECTORY:}
    poll-delay-ms: 3000
  security:
    owner-id: ${STUDIO_OWNER_ID:}
    username: ${STUDIO_ADMIN_USERNAME:}
    password-hash: ${STUDIO_ADMIN_PASSWORD_HASH:}

logging:
  structured:
    format:
      console: ecs
