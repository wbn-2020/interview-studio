name: interview-studio

x-java: &java
  image: ${STUDIO_JAVA_IMAGE:?select a pinned Java 21 runtime}
  user: "10001:10001"
  working_dir: /release
  env_file:
    - path: ${STUDIO_APPLICATION_ENV:-${STUDIO_DEPLOY_ROOT}/config/application.env}
      format: raw
  volumes:
    - ${STUDIO_RELEASE_PATH}:/release:ro
  networks: [workspace]

services:
  database:
    image: ${STUDIO_MYSQL_IMAGE:?select a pinned MySQL 8.4 image}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: interview_studio
      MYSQL_USER: interview_studio
      MYSQL_PASSWORD_FILE: /run/secrets/database_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/database_root_password
      TZ: UTC
    secrets: [database_password, database_root_password]
    volumes:
      - database:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=268435456
    healthcheck:
      test: ["CMD", "mysqladmin", "--no-defaults", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s
    mem_limit: 2g
    cpus: 2
    networks: [workspace]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    <<: *java
    profiles: [maintenance]
    command: ["java", "-Xmx256m", "-cp", "/release/migration/classes:/release/migration/lib/*", "Migrate"]
    depends_on:
      database: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1

  application:
    <<: *java
    restart: unless-stopped
    command: ["java", "-Xms256m", "-Xmx1024m", "-XX:+ExitOnOutOfMemoryError", "-jar", "/release/application.jar"]
    depends_on:
      database: {condition: service_healthy}
    volumes:
      - ${STUDIO_RELEASE_PATH}:/release:ro
      - ${STUDIO_DEPLOY_ROOT}/data/materials:/data/materials
      - ${STUDIO_DEPLOY_ROOT}/data/search:/data/search
      - ${STUDIO_DEPLOY_ROOT}/data/exports:/data/exports
      - ${STUDIO_DEPLOY_ROOT}/privacy-ledger:/data/privacy-ledger
    mem_limit: 2g
    cpus: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  web:
    image: ${STUDIO_NGINX_IMAGE:?select a pinned nginx image}
    restart: unless-stopped
    depends_on: [application]
    ports: ["30080:8080", "30081:8443"]
    volumes:
      - ${STUDIO_RELEASE_PATH}/web:/usr/share/nginx/html:ro
      - ${STUDIO_DEPLOY_ROOT}/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STUDIO_DEPLOY_ROOT}/tls:/etc/nginx/tls:ro
    mem_limit: 256m
    cpus: 1
    networks: [workspace]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

secrets:
  database_password:
    file: ${STUDIO_DEPLOY_ROOT}/config/database-password
  database_root_password:
    file: ${STUDIO_DEPLOY_ROOT}/config/database-root-password

volumes:
  database:

networks:
  workspace:
    driver: bridge
